# Armbian build config: NVIDIA Jetson Nano Developer Kit (P3449-0000-B01 carrier + P3448-0000 module)
# Ubuntu 26.04 "resolute", XFCE desktop, mainline kernel (no L4T, no CUDA).
#
# Used as: ./compile.sh jetson-nano-xfce   (build.sh does this for you)

declare -g BOARD="jetson-nano"           # config/boards/jetson-nano.eos -> uefi-arm64 family, GRUB + DTB
declare -g BRANCH="current"              # mainline 6.18 LTS (board's KERNEL_TEST_TARGET)
declare -g RELEASE="resolute"            # Ubuntu 26.04 LTS

declare -g BUILD_MINIMAL="no"
declare -g BUILD_DESKTOP="yes"
declare -g DESKTOP_ENVIRONMENT="xfce"
declare -g DESKTOP_TIER="mid"            # minimal | mid | full

declare -g KERNEL_CONFIGURE="no"         # stock Armbian uefi-arm64 config already has Tegra210 drivers
declare -g KERNEL_GIT="shallow"
declare -g COMPRESS_OUTPUTIMAGE="sha,img,xz"

# Kernel cmdline comes from the board file: "efi=noruntime console=ttyS0,115200n8" (debug UART on J50);
# the framework appends "console=tty1 splash" for desktop images, so boot is visible on HDMI as well.
